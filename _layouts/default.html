<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <!-- Preload avatar -->
  <link rel="preload" as="image" href="{{ site.baseurl }}/assets/icons/avatar.webp">
  <!-- Inline script to set dark mode immediately -->
  <script>
    (function() {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark-mode');
      }
    }());
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="icon" href="{{ site.baseurl }}/assets/icons/favicon.ico" type="image/x-icon">
</head>
<script>
  document.addEventListener("DOMContentLoaded", function () {
      const themeToggle = document.getElementById("theme-toggle");
      const root = document.documentElement;  // use the <html> element

      themeToggle.addEventListener("click", function () {
        root.classList.toggle("dark-mode");
        if (root.classList.contains("dark-mode")) {
          localStorage.setItem("theme", "dark");
        } else {
          localStorage.setItem("theme", "light");
        }
      });
  });
</script>  
<body>
    <nav>
      <div id="nav-links">
        <a href="/">
          <img src="{{ site.baseurl }}/assets/icons/avatar.png" alt="Site Icon" class="nav-icon" width="40" height="40">
        </a>
        <a href="/">
          Home
        </a>
        <a href="/blog">Blog</a>
      </div>
      <div class="nav-controls">
        <button id="theme-toggle" aria-label="Toggle theme">
          <img id="sun-icon" src="{{ site.baseurl }}/assets/icons/sun.svg" alt="Light Mode">
          <img id="moon-icon" src="{{ site.baseurl }}/assets/icons/moon.svg" alt="Dark Mode">
        </button>
      </div>
    </nav>
