title: Minimalist Jekyll Blog
author: Your Name
description: A simple, clean Jekyll blog
theme: minima

# Permalink structure for blog posts
permalink: /blog/:year/:month/:title/

# Build settings
sass:
  quiet_deps: true
  silence_deprecations:
    - color-functions
    - import

pagination:
  enabled: true
  per_page: 10
  permalink: "/:num/"
  title: ":title - Page :num"
  sort_field: "date"
  sort_reverse: true
  trail:
    before: 2
    after: 2

# Plugins
plugins:
  - jekyll-paginate-v2
  - jekyll-minifier
